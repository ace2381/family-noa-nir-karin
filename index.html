        const HIDE_DAYS = new Set(['noa-school', 'nir-school', 'karin-school', 'duties', 'noa-exams', 'nir-exams', 'karin-exams', 'holidays', 'limor-holidays']);

        function jsDayToHebrew() {
            return ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'][new Date().getDay()];
        }

        function todayAtMidnight() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function parseISO(s) {
            const [y, m, d] = s.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function fmtDate(s) {
            const [y, m, d] = s.split('-');
            return `${d}.${m}.${y}`;
        }

        function eventStatus(ev) {
            const now = todayAtMidnight();
            const start = parseISO(ev.start);
            const end = parseISO(ev.end || ev.start);
            if (now >= start && now <= end) return 'current';
            if (now < start) return 'future';
            return 'past';
        }

            return KIDS.find(k => k.id === id);

            if (/כימיה|ביולוגיה|מדעים|מבוא/.test(subject)) return 'tt-subj-sci';
            if (/חנ״ג|חנ"ג|חינוך גופני|של"ח|של״ח/.test(subject)) return 'tt-subj-pe';

            if (/אומנות|מוסיקה|מחול/.test(subject)) return 'tt-subj-art';
            if (/ספרות|לשון|עברית|ערבית/.test(subject)) return 'tt-subj-lang';
            return 'tt-subj-values';

            const cards = enriched.map(ev => {
                const isNext = next && next.start === ev.start && next.title === ev.title;
                let frame = 'border-stone-200 bg-white/95';
                let badge = '';
                if (ev.status === 'current') {
                    frame = 'border-amber-500 bg-amber-50 ring-2 ring-amber-400/40';
                    badge = '<span class="text-[10px] font-bold bg-amber-600 text-white px-2 py-0.5 rounded-full">היום</span>';
                } else if (isNext) {
                    const days = Math.round((parseISO(ev.start) - todayAtMidnight()) / 86400000);
                    frame = 'border-amber-300 bg-amber-50/60';
                    badge = `<span class="text-[10px] font-bold bg-amber-100 text-amber-900 px-2 py-0.5 rounded-full">הקרוב · בעוד ${days} ימים</span>`;
                } else if (ev.status === 'past') {
                    frame = 'border-stone-200 bg-stone-50 opacity-60';
                    badge = '<span class="text-[10px] font-bold bg-stone-200 text-stone-600 px-2 py-0.5 rounded-full">עבר</span>';
                }
                const when = ev.end && ev.end !== ev.start ? `${fmtDate(ev.start)} – ${fmtDate(ev.end)}` : fmtDate(ev.start);
                return `
                    <article class="rounded-2xl border ${frame} p-3 shadow-sm">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <h3 class="text-sm font-extrabold text-stone-900">${ev.title}</h3>
                            ${badge}
                        </div>
                        <p class="mt-1.5 text-xs font-bold text-stone-600" dir="ltr">${when}</p>
                    </article>
                `;
            }).join('');
            return `
                <section class="space-y-3">
                    <div class="bg-white/95 rounded-2xl border border-stone-200 p-3.5 sm:p-4 shadow-sm">
                        <h2 class="text-lg sm:text-xl font-extrabold ${kid.nameClass}">בחינות ואירועים · ${kid.name}</h2>
                        <p class="text-xs text-stone-500 mt-0.5">${kid.grade}</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${cards}</div>
                </section>
            `;
        }

        function holidayStatus(h) {
            const now = todayAtMidnight();
            const start = parseISO(h.start);
            const end = parseISO(h.end);
            if (now >= start && now <= end) return 'current';
            if (now < start) return 'future';
            return 'past';
        }

        function renderHolidays(list, title, subtitle) {
            const enriched = list.map(h => ({ ...h, status: holidayStatus(h) }));
            const next = enriched.find(h => h.status === 'future');
            const cards = enriched.map(h => {
                let frame = 'border-stone-200 bg-white/95';
                let badge = '';
                if (h.status === 'current') {
                    frame = 'border-emerald-500 bg-emerald-50 ring-2 ring-emerald-500/40';
                    badge = '<span class="text-[10px] font-bold bg-emerald-600 text-white px-2 py-0.5 rounded-full">עכשיו</span>';
                } else if (next && next.name === h.name) {
                    const days = Math.round((parseISO(h.start) - todayAtMidnight()) / 86400000);
                    frame = 'border-emerald-300 bg-emerald-50/50';
                    badge = `<span class="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">הקרוב · בעוד ${days} ימים</span>`;
                } else if (h.status === 'past') {
                    frame = 'border-stone-200 bg-stone-50 opacity-60';
                    badge = '<span class="text-[10px] font-bold bg-stone-200 text-stone-600 px-2 py-0.5 rounded-full">עבר</span>';
                }
                const when = h.start === h.end ? fmtDate(h.start) : `${fmtDate(h.start)} – ${fmtDate(h.end)}`;
                return `
                    <article class="rounded-2xl border ${frame} p-3 shadow-sm space-y-2">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <h3 class="text-sm sm:text-base font-extrabold text-stone-900">${h.name}</h3>
                            ${badge}
                        </div>
                        <p class="text-xs font-extrabold text-emerald-800" dir="ltr">${when}</p>
                    </article>
                `;
            }).join('');
            return `
                <section class="space-y-3">
                    <div class="bg-white/95 rounded-2xl border border-emerald-200 p-3.5 sm:p-4 shadow-sm">
                        <h2 class="text-lg sm:text-xl font-extrabold text-emerald-800">${title}</h2>
                        <p class="text-xs text-stone-500 mt-0.5">${subtitle}</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${cards}</div>
                </section>
            `;
        }

        function render() {
            document.getElementById('today-badge').textContent = `היום: ${jsDayToHebrew()}`;
            renderDaysBar();
            const root = document.getElementById('schedule-root');
            if (activeFilter === 'noa-school') root.innerHTML = renderSchool('noa');
            else if (activeFilter === 'nir-school') root.innerHTML = renderSchool('nir');
            else if (activeFilter === 'karin-school') root.innerHTML = renderSchool('karin');
            else if (activeFilter === 'duties') root.innerHTML = renderDuties();
            else if (activeFilter === 'noa-exams') root.innerHTML = renderEvents('noa');
            else if (activeFilter === 'nir-exams') root.innerHTML = renderEvents('nir');
            else if (activeFilter === 'karin-exams') root.innerHTML = renderEvents('karin');
            else if (activeFilter === 'holidays') root.innerHTML = renderHolidays(HOLIDAYS, 'לוח חופשות · תשפ״ז', 'תיכון היובל');
            else if (activeFilter === 'limor-holidays') root.innerHTML = renderHolidays(LIMOR_HOLIDAYS, 'לוח חופשות · לימור', 'אוניברסיטה');
            else root.innerHTML = renderDay();
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                render();
            });
        });

        render();
    </script>
</body>
</html>
